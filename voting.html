<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyuncu Değerlendirme</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#f4f4f4}.vote-card{background:#fff;border-radius:16px;padding:25px;box-shadow:0 4px 15px rgba(0,0,0,.1)}.target-player{text-align:center;margin-bottom:30px}.target-player h2{color:#e60000}.rating-group{margin-bottom:30px}.rating-header{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:bold}.score-value{color:#e60000}.stars{display:flex;gap:8px}.star{font-size:36px;color:#d0d0d0;cursor:pointer}.star.active{color:#ffb400}.save-btn{width:100%;padding:15px;border:0;border-radius:10px;background:#e60000;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="container"><div class="vote-card">
<div class="target-player"><h1>⚽ Oyuncu Değerlendirme</h1><h2 id="targetPlayerName"></h2></div>
<form id="voteForm">
<div class="rating-group"><div class="rating-header"><span>Kondisyon</span><span id="conditionText" class="score-value">0/5</span></div><div class="stars" id="conditionStars"></div></div>
<div class="rating-group"><div class="rating-header"><span>Teknik</span><span id="techniqueText" class="score-value">0/5</span></div><div class="stars" id="techniqueStars"></div></div>
<div class="rating-group"><div class="rating-header"><span>Hücum</span><span id="attackText" class="score-value">0/5</span></div><div class="stars" id="attackStars"></div></div>
<div class="rating-group"><div class="rating-header"><span>Savunma</span><span id="defenseText" class="score-value">0/5</span></div><div class="stars" id="defenseStars"></div></div>
<div class="rating-group"><div class="rating-header"><span>Takım Oyunu</span><span id="teamplayText" class="score-value">0/5</span></div><div class="stars" id="teamplayStars"></div></div>
<button type="submit" class="save-btn">Kaydet</button>
</form></div></div>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/voting.js"></script>
</body></html>
